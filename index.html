<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kris Recomp Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column console. Summary strip first, then detail panels. Tabs as a bottom bar on phones, a top rail on laptops.
   One accent (indigo) marks the chest and arm priority; green, amber, red and blue are state only. */
:root {
  --bg: #F3F4F7; --surface: #FFFFFF; --ink: #151922; --mute: #5A6273; --line: #DCE0E8; --tint: #ECEEF4;
  --accent: #4338CA; --accent-ink: #FFFFFF; --accent-soft: #E4E2FA;
  --ok: #0E6E3E; --ok-bg: #DCF2E5; --warn: #835400; --warn-bg: #FAEDCB; --bad: #AE2216; --bad-bg: #FADFDB; --info: #1D4B88; --info-bg: #DFE9F7;
  --chart-a: #4338CA; --chart-b: #8A93A6; --bm-off: #E4E7EE; --z1: #7FB2E5; --z2: #2BB3A3; --z3: #9BC53D; --z4: #F0A23B; --z5: #E5487A; --up: #1F8A4C; --down: #B4462F; --chart-grid: #E3E6EE;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1117; --surface: #161B24; --ink: #E6E9EF; --mute: #9AA3B4; --line: #2A3140; --tint: #1C2230;
    --accent: #A29CFF; --accent-ink: #12102E; --accent-soft: #2A2754;
    --ok: #74D7A3; --ok-bg: #12301F; --warn: #F0C35C; --warn-bg: #3A2C0B; --bad: #FF9D90; --bad-bg: #44201B; --info: #9DC1F5; --info-bg: #1A2A45;
    --chart-a: #A29CFF; --chart-b: #6F788B; --bm-off: #232A38; --z1: #5B9BDB; --z2: #34C5B4; --z3: #A8D25A; --z4: #F2B05A; --z5: #F0668F; --up: #5CCB8A; --down: #F08A70; --chart-grid: #252C3A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1117; --surface: #161B24; --ink: #E6E9EF; --mute: #9AA3B4; --line: #2A3140; --tint: #1C2230;
  --accent: #A29CFF; --accent-ink: #12102E; --accent-soft: #2A2754;
  --ok: #74D7A3; --ok-bg: #12301F; --warn: #F0C35C; --warn-bg: #3A2C0B; --bad: #FF9D90; --bad-bg: #44201B; --info: #9DC1F5; --info-bg: #1A2A45;
  --chart-a: #A29CFF; --chart-b: #6F788B; --bm-off: #232A38; --z1: #5B9BDB; --z2: #34C5B4; --z3: #A8D25A; --z4: #F2B05A; --z5: #F0668F; --up: #5CCB8A; --down: #F08A70; --chart-grid: #252C3A; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, th.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin-inline: auto; padding-inline: 16px; padding-block: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-stretch: 78%; font-size: 21px; letter-spacing: 0.01em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand small { display: block; font-family: var(--f-num); font-weight: 400; font-size: 11px; letter-spacing: 0.02em; text-transform: none; color: var(--mute); margin-top: 4px; font-stretch: 100%; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; color: var(--mute); cursor: pointer; }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tools { display: flex; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--mute); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.danger { color: var(--bad); }
select.btn { padding-right: 8px; }
@media (max-width: 899px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; }
  .tab { flex: 1; padding: 9px 4px; font-size: 13.5px; }
  main { padding-bottom: 84px !important; }
}
main { max-width: 1120px; margin-inline: auto; padding-inline: 16px; padding-block: 18px 56px; display: flex; flex-direction: column; gap: 22px; }

/* type */
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 28px; font-weight: 800; font-stretch: 85%; }
h2 { font-size: 20px; font-weight: 750; font-stretch: 88%; letter-spacing: 0.005em; }
h3 { font-size: 16px; font-weight: 700; font-stretch: 95%; }
.eyebrow { font-family: var(--f-num); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.mute { color: var(--mute); }
.small { font-size: 13px; }
.lede { color: var(--mute); max-width: 68ch; margin: 4px 0 0; }
p { margin: 0; }

/* blocks */
section.blk { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap; }
.hd .mute { font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.panel.flat { background: transparent; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.note { font-size: 12.5px; color: var(--mute); }
.assume { font-size: 12px; color: var(--info); }
.assume::before { content: "Assumption: "; font-weight: 700; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }

/* summary strip: a sentence-like status line, not tiles */
.strip { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; }
.stat b { font-family: var(--f-num); font-weight: 600; }

/* chips */
.chip { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.ok { background: var(--ok-bg); color: var(--ok); } .warn { background: var(--warn-bg); color: var(--warn); }
.bad { background: var(--bad-bg); color: var(--bad); } .info { background: var(--info-bg); color: var(--info); }
.neutral { background: var(--tint); color: var(--mute); }
.pri { background: var(--accent-soft); color: var(--accent); }
.prirow td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.prilabel { color: var(--accent); font-weight: 700; }

/* tables */
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--mute); font-weight: 600; padding: 7px 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tfoot td { border-top: 1.5px solid var(--ink); font-weight: 700; }
tr.grp td { background: var(--tint); font-weight: 700; }

/* forms */
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label, .lab { font-size: 12px; color: var(--mute); font-weight: 600; }
.inp { font-family: var(--f-num); font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); width: 100%; min-width: 0; }
.inp.bad-in { border-color: var(--bad); background: var(--bad-bg); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 0; width: 34px; cursor: pointer; font-family: var(--f-num); font-size: 14px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
.seg.fat button[data-v="1"][aria-pressed="true"], .seg.fat button[data-v="2"][aria-pressed="true"] { background: var(--bad); color: var(--surface); }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

/* today exercise cards */
.ex { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ex.priority { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.ex-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.ex-name { font-family: var(--f-display); font-weight: 750; font-size: 17px; font-stretch: 90%; }
.presc { font-family: var(--f-num); font-size: 13.5px; }
.presc b { font-size: 15px; }
.ex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.cue { font-size: 13px; color: var(--mute); }
.exlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .exlist { grid-template-columns: 1fr; } }

/* heat table */
.heat td.c { text-align: center; font-family: var(--f-num); font-size: 12.5px; padding: 6px 2px; min-width: 34px; border-bottom: 2px solid var(--surface); }
.heat td.c.lo { background: var(--bad-bg); color: var(--bad); }
.heat td.c.in { background: var(--ok-bg); color: var(--ok); }
.heat td.c.hi { background: var(--warn-bg); color: var(--warn); }
.heat td.c.zero { color: var(--mute); }
.heat td.c.cur { outline: 1.5px dashed var(--mute); outline-offset: -3px; }
.heat th.c { text-align: center; padding: 6px 2px; font-size: 10.5px; letter-spacing: 0; }
.heat td.m { white-space: nowrap; font-weight: 600; position: sticky; left: 0; background: var(--surface); z-index: 1; }

/* bars */
.bar { position: relative; height: 12px; background: var(--tint); border-radius: 3px; min-width: 80px; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 3px; background: var(--chart-b); }
.bar .band { position: absolute; top: -2px; bottom: -2px; border-left: 1.5px solid var(--ok); border-right: 1.5px solid var(--ok); background: color-mix(in srgb, var(--ok) 16%, transparent); }
.mbar { display: grid; grid-template-columns: 88px 1fr 120px; gap: 10px; align-items: center; }
@media (max-width: 520px) { .mbar { grid-template-columns: 1fr; gap: 4px; } }

/* charts */
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--mute); font-family: var(--f-num); font-size: 11px; }
svg.chart .grid { stroke: var(--chart-grid); stroke-width: 1; }
svg.chart .axis { stroke: var(--line); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--mute); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }

/* meal strip */
.mstrip { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 4px; }
.mcell { height: 44px; border-radius: 5px; display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--f-num); font-size: 10.5px; line-height: 1.15; border: 1px solid transparent; }
.c-fridge { background: var(--info-bg); color: var(--info); }
.c-freeze { background: var(--tint); color: var(--ink); border-color: var(--line); }
.c-have { background: var(--ok-bg); color: var(--ok); }
.c-part { background: var(--warn-bg); color: var(--warn); }
.c-need { color: var(--bad); border: 1.5px dashed var(--bad); }

/* data drawer */
.drawer { border-bottom: 1px solid var(--line); background: var(--surface); }
.drawer-in { max-width: 1120px; margin-inline: auto; padding-inline: 16px; padding-block: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 9px 12px; border-radius: 8px; font-size: 14px; }
textarea.inp { min-height: 90px; font-size: 12px; }
.empty { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
details > summary { cursor: pointer; font-weight: 600; }
details[open] > summary { margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--mute); }
.kv dd { margin: 0; font-family: var(--f-num); }
.ladder { display: flex; gap: 4px; flex-wrap: wrap; }
.step { font-family: var(--f-num); font-size: 12.5px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); }
.step.now { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.step.done { background: var(--tint); color: var(--mute); text-decoration: line-through; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .3s ease; } }
.bmap { max-width: 860px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
#bodymap { scroll-margin-top: 90px; }
.bm-svg { width: 100%; max-width: 420px; height: auto; }
.bm-list { display: grid; gap: 6px; }
.bm-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; }
.bm-sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
@media (max-width: 640px) { .bmap { grid-template-columns: minmax(0, 1fr); } .bm-svg { margin: 0 auto; display: block; } }

/* log */
.weeks { display: flex; flex-direction: column; gap: 10px; }
.wk { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 0; }
.wk.cur { border-color: var(--accent); }
.wk-h { width: 100%; display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: space-between; align-items: baseline; padding: 12px 14px; border: 0; background: none; cursor: pointer; text-align: left; color: var(--ink); font: inherit; font-weight: 600; }
.wk-h > span:first-child::before { content: "+"; display: inline-block; width: 14px; font-family: var(--f-num); color: var(--mute); }
.wk-h[aria-expanded="true"] > span:first-child::before { content: "-"; }
.wk-n { font-family: var(--f-num); font-size: 12px; letter-spacing: 0.08em; color: var(--accent); margin-right: 6px; }
.wk-b { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.ld { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.ld:last-child { border-bottom: 0; }
.ld-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; scroll-margin-top: 130px; }
.ld-day { font-family: var(--f-num); font-size: 12px; letter-spacing: 0.06em; color: var(--mute); margin-right: 4px; }
.ld-ch { font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
table.lg { font-size: 13px; width: max-content; min-width: 100%; }
table.lg th, table.lg td { padding: 6px 6px; vertical-align: top; }
table.lg th.lx { position: sticky; left: 0; z-index: 1; background: var(--surface); text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); font-weight: 600; white-space: normal; width: 190px; min-width: 150px; max-width: 210px; box-shadow: 1px 0 0 var(--line); }
table.lg thead th.lx { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--mute); }
.lx-cue { font-weight: 400; margin-top: 2px; }
.inp.cell { padding: 4px 6px; font-size: 13.5px; width: 76px; }
select.inp.cell { width: 62px; padding-right: 2px; }
td select.inp.cell[data-f="repsDone"] { width: 96px; }
.inp.cell.wide { width: 180px; font-family: var(--f-body, inherit); }
.up { color: var(--up); } .down { color: var(--down); }
.bad-t { color: var(--bad); }
.lg-add { gap: 8px; }
.acts { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.act { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.sub { background: var(--tint); }
.runblk { display: flex; flex-direction: column; gap: 8px; border-left: 3px solid var(--z2); padding-left: 10px; }
.rf-g { border: 0; padding: 0; margin: 0; min-width: 0; }
.rf-g legend { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); font-weight: 600; padding: 0 0 6px; }
.field.span2 { grid-column: 1 / -1; }
.zbs { display: flex; flex-direction: column; gap: 6px; }
.zb { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; }
.zbar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--tint); }
.zbar i { display: block; height: 100%; }
figure.rc { margin: 0; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 760px) { .tab { font-size: 12px; padding: 9px 1px; } .lx-cue { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } }
@media (min-width: 761px) { .tab { padding: 8px 9px; } }
td.nw { white-space: nowrap; }
</style>
</head>
<body>
<div id="app"><main id="gate" style="max-width:380px;margin:12vh auto 0;padding-inline:16px">
  <form class="panel stack" id="gateform" autocomplete="on">
    <div><div class="eyebrow">Private</div><h1>Kris Recomp Board</h1></div>
    <div class="field"><label for="gatepw">Password</label><input class="inp" id="gatepw" type="password" inputmode="numeric" autocomplete="current-password" required></div>
    <label class="row small" style="gap:6px"><input type="checkbox" id="gaterem" checked> Remember on this device</label>
    <button class="btn primary" type="submit" id="gatebtn">Unlock</button>
    <p class="note" id="gatemsg" role="status"></p>
  </form></main></div>
